name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: '1.3.9'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate version
        shell: bash
        run: |
          TAG_VERSION="${{ inputs.tag || github.ref_name }}"

          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "Tag:      $TAG_VERSION"
          echo "Manifest: $MANIFEST_VERSION"
          echo "Package:  $PACKAGE_VERSION"

          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: manifest.json version does not match tag"
            exit 1
          fi

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package.json version does not match tag"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Prepare release files
        shell: bash
        run: |
          rm -rf release
          mkdir -p release

          test -f main.js
          test -f manifest.json

          cp main.js release/main.js
          cp manifest.json release/manifest.json

          if [ -f styles.css ]; then
            cp styles.css release/styles.css
          fi

          echo "Release files:"
          ls -lah release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}